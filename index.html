<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Música</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <style>
    :root { --bg: #121212; --card-bg: #181818; --accent: #1db954; --text: #ffffff; --text-muted: #b3b3b3; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; }
    
    #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
    .btn-google { background: #ffffff; color: #000; border: none; padding: 12px 24px; border-radius: 24px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 20px; display: flex; align-items: center; gap: 10px; }
    
    #app-screen { display: none; flex-direction: column; height: 100vh; }
    header { padding: 20px; border-bottom: 1px solid #282828; display: flex; justify-content: space-between; align-items: center; }
    .header-buttons { display: flex; gap: 10px; }
    .btn { background: var(--accent); color: #000; border: none; padding: 10px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    .btn-logout { background: transparent; color: var(--text-muted); border: 1px solid var(--text-muted); }
    #file-input { display: none; }
    
    main { flex: 1; overflow-y: auto; padding: 20px; }
    .track-list { display: flex; flex-direction: column; gap: 8px; max-width: 800px; margin: 0 auto; }
    .track-card { display: flex; align-items: center; gap: 16px; padding: 10px; background: var(--card-bg); border-radius: 8px; cursor: pointer; }
    .track-card:hover { background: #282828; }
    .track-card.active { border-left: 4px solid var(--accent); background: #222; }
    
    .cover-img { width: 50px; height: 50px; border-radius: 4px; object-fit: cover; background: #333; }
    .track-info h3 { font-size: 1rem; margin-bottom: 4px; }
    .track-info p { font-size: 0.85rem; color: var(--text-muted); }
    
    footer { background-color: #181818; padding: 16px; text-align: center; border-top: 1px solid #282828; }
    audio { width: 100%; max-width: 600px; height: 40px; margin-top: 10px; }
    #status { font-size: 0.9rem; text-align: center; margin-bottom: 10px; font-weight: bold; }
  </style>
</head>
<body>

  <div id="login-screen">
    <h1>🎧 Mi Música Privada</h1>
    <p style="color: var(--text-muted); margin-top: 10px;">Iniciá sesión para acceder a tu biblioteca</p>
    <button class="btn-google" onclick="loginGoogle()">
      <img src="https://img.icons8.com/color/24/000000/google-logo.png" alt="Google">
      Ingresar con Google
    </button>
  </div>

  <div id="app-screen">
    <header>
      <h1>Mi Biblioteca</h1>
      <div class="header-buttons">
        <button class="btn" onclick="document.getElementById('file-input').click()">+ Subir Canción</button>
        <button class="btn btn-logout" onclick="logout()">Salir</button>
      </div>
      <input type="file" id="file-input" accept="audio/*">
    </header>

    <main>
      <div id="status"></div>
      <div id="playlist" class="track-list">Cargando...</div>
    </main>

    <footer>
      <div id="now-playing">Seleccioná una canción para reproducir</div>
      <audio id="audio-player" controls autoplay></audio>
    </footer>
  </div>

  <script>
    // --- 1. CONFIGURACIÓN ---
    const SUPABASE_URL = "https://jiitqxjhxteayixongez.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImppaXRxeGpoeHRlYXlpeG9uZ2V6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MjI3MzAsImV4cCI6MjEwNzQ5ODczMH0.4lli6xh7WnW-B2dIhNgzEjgeJzmGt8J3w93hOBgue3g"; // <-- Reemplazá por tu clave que empieza con eyJ
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const loginScreen = document.getElementById("login-screen");
    const appScreen = document.getElementById("app-screen");
    const playlistContainer = document.getElementById("playlist");
    const audioPlayer = document.getElementById("audio-player");
    const statusText = document.getElementById("status");
    
    let songs = [];
    let currentIndex = -1;

    // --- 2. AUTENTICACIÓN ---
    async function checkUser() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        loginScreen.style.display = "none";
        appScreen.style.display = "flex";
        loadTracks();
      } else {
        loginScreen.style.display = "flex";
        appScreen.style.display = "none";
      }
    }

    async function loginGoogle() {
      const { error } = await supabaseClient.auth.signInWithOAuth({ 
        provider: 'google',
        options: { redirectTo: window.location.origin + window.location.pathname }
      });
      if (error) alert("Error al iniciar sesión: " + error.message);
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.reload(); 
    }

    // --- 3. CARGAR CANCIONES ---
    async function loadTracks() {
      const { data, error } = await supabaseClient.from("tracks").select("*").order("id", { ascending: true });
      if (error) {
        console.error("Error cargando canciones:", error);
        return;
      }
      songs = data || [];
      
      playlistContainer.innerHTML = songs.length ? "" : "No hay canciones en tu biblioteca.";
      songs.forEach((song, index) => {
        const card = document.createElement("div");
        card.className = `track-card ${index === currentIndex ? 'active' : ''}`;
        card.onclick = () => playSong(index);
        card.innerHTML = `
          <img src="${song.cover_url || 'https://via.placeholder.com/50'}" class="cover-img">
          <div class="track-info">
            <h3>${song.title}</h3>
            <p>${song.artist} • ${song.album}</p>
          </div>
        `;
        playlistContainer.appendChild(card);
      });
    }

    // --- 4. REPRODUCCIÓN ---
    function playSong(index) {
      currentIndex = index;
      const song = songs[currentIndex];
      audioPlayer.src = song.url;
      audioPlayer.play();
      document.getElementById("now-playing").innerHTML = `<b>${song.title}</b> - ${song.artist}`;
      loadTracks(); // Para marcar la tarjeta activa
    }
    
    audioPlayer.addEventListener("ended", () => {
      if (currentIndex < songs.length - 1) playSong(currentIndex + 1);
    });

    // --- 5. SUBIDA MEJORADA CON MANEJO DE ERRORES ---
    document.getElementById("file-input").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      // Limpia el input por si querés subir la misma canción después de un error
      e.target.value = '';

      statusText.style.color = "var(--accent)";
      statusText.innerText = "Preparando archivo...";

      const procesarSubida = async (tags) => {
        try {
          const title = (tags && tags.title) ? tags.title : file.name.replace(/\.[^/.]+$/, "");
          const artist = (tags && tags.artist) ? tags.artist : "Desconocido";
          const album = (tags && tags.album) ? tags.album : "Desconocido";

          let cover_url = null;
          if (tags && tags.picture) {
            statusText.innerText = "Subiendo portada...";
            const blob = new Blob([new Uint8Array(tags.picture.data)], { type: tags.picture.format });
            const coverPath = `covers/cover_${Date.now()}.jpg`;
            const { error: coverError } = await supabaseClient.storage.from("canciones").upload(coverPath, blob);
            if (coverError) throw new Error("Permiso denegado para subir imagen: " + coverError.message);
            cover_url = supabaseClient.storage.from("canciones").getPublicUrl(coverPath).data.publicUrl;
          }

          statusText.innerText = "Subiendo audio a Supabase...";
          const audioPath = `audios/audio_${Date.now()}.mp3`;
          const { error: audioError } = await supabaseClient.storage.from("canciones").upload(audioPath, file);
          if (audioError) throw new Error("Permiso denegado para subir audio: " + audioError.message);
          const audio_url = supabaseClient.storage.from("canciones").getPublicUrl(audioPath).data.publicUrl;

          statusText.innerText = "Guardando título y artista en la base de datos...";
          const { error: insertError } = await supabaseClient.from("tracks").insert([{ title, artist, album, url: audio_url, cover_url }]);
          if (insertError) throw new Error("Permiso denegado en la Base de Datos: " + insertError.message);

          statusText.innerText = "¡Subida exitosa!";
          setTimeout(() => statusText.innerText = "", 4000);
          loadTracks(); // Vuelve a cargar la lista para que aparezca la nueva canción

        } catch (err) {
          console.error(err);
          statusText.style.color = "#ff4444"; // Letras rojas para el error
          statusText.innerText = "ERROR: " + err.message;
        }
      };

      // Intentamos leer la portada y nombre, pero si falla, subimos el archivo igual
      window.jsmediatags.read(file, {
        onSuccess: function(tag) { procesarSubida(tag.tags); },
        onError: function(error) { 
          console.warn("No hay metadatos, subiendo con nombre normal...", error);
          procesarSubida(null); 
        }
      });
    });

    checkUser();
  </script>
</body>
</html>
